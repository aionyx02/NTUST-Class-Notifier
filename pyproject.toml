[project]
name = "ntust-class-notifier"
version = "0.1.6"
description = "監控台科大課程空額，支援終端機監看、搶課提醒與 Discord 通知"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "aionyx" }]
dependencies = [
    "discord-py>=2.4.0",
    "httpx[http2]>=0.28.1",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0.1",
    "audioop-lts>=0.2.2",
    "pip-system-certs>=5.3",
    "pynacl>=1.6.2",
    "davey>=0.1.6",
]

[project.urls]
Homepage = "https://github.com/aionyx02/NTUST-Class-Notifier"
Issues = "https://github.com/aionyx02/NTUST-Class-Notifier/issues"

[project.scripts]
ntust-notify = "ntust_class_notifier.cli.notify:run"
ntust-watch = "ntust_class_notifier.cli.watch:main"
ntust-alert = "ntust_class_notifier.cli.alert:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntust_class_notifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["ntust_class_notifier"]
